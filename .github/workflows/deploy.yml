# Compila o site em Flutter Web e publica no GitHub Pages a cada envio para
# a branch main. Também dá para rodar manualmente em Actions > Publicar site.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verificar e compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write # para atualizar o download "site-pronto"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar o código
        run: flutter analyze --no-fatal-infos

      - name: Rodar os testes
        run: flutter test --file-reporter json:test-results.json

      - name: Mostrar falhas dos testes
        if: failure()
        run: python3 .github/scripts/test_failures.py test-results.json

      - name: Gerar a versão de produção
        # O endereço do Pages fica em /<nome-do-repositório>/.
        # Ao ligar um domínio próprio, troque por: --base-href /
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Cópia do site pronto para qualquer hospedagem (Hostinger, cPanel,
      # Netlify), com o endereço base na raiz do domínio. Fica em
      # Releases > "Site pronto para hospedar" e é atualizada a cada publicação.
      - name: Guardar cópia do site para outras hospedagens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf site-pronto && cp -r build/web site-pronto
          sed -i 's#<base href="[^"]*">#<base href="/">#' site-pronto/index.html
          (cd site-pronto && zip -qr ../site-pronto.zip .)
          if ! gh release view site-pronto >/dev/null 2>&1; then
            gh release create site-pronto --title "Site pronto para hospedar" --notes "Cópia do site já compilado. Para usar em outra hospedagem, descompacte o arquivo site-pronto.zip e envie o conteúdo para a pasta pública do domínio (por exemplo, public_html). Este arquivo é atualizado a cada publicação."
          fi
          gh release upload site-pronto site-pronto.zip --clobber

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
