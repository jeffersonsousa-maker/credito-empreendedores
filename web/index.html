  <style>
    html, body { margin: 0; padding: 0; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1C1C21; transition: opacity .25s ease;
    }
    #splash .mark {
      width: 56px; height: 56px; border-radius: 16px; background: #E11B22;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(225, 27, 34, .25);
    }
    #splash .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #F9D3D4; border-top-color: #E11B22;
      animation: spin .8s linear infinite;
    }
    #splash p { margin: 0; font-size: 15px; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation: none; } }
  </style>
</head>
